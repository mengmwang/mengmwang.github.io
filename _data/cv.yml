- title: Selected Projects
  type: time_table
  contents:
    - title: "Applied GenAI: Evidence Extraction & Cross-Paper Synthesis"
      description:
        - Designed an LLM-based pipeline extracting structured data from clinical trial literature using constrained, schema-driven prompts on a locally hosted model, achieving 92% successful extraction across a 600+ paper pilot corpus.
        - Extended the system with a cross-paper synthesis layer -- vector retrieval, reranking, and map-reduce narrative synthesis -- to answer evidence questions spanning multiple papers rather than one document at a time.
    - title: Retrieval-Augmented Generation System for Internal Training Resources
      description:
        - "Architected an end-to-end RAG application: web crawler and document ingestion, heading-aware chunking, hybrid dense + BM25 retrieval with reciprocal rank fusion, and cross-encoder reranking."
        - Delivered grounded, citation-backed answers via a FastAPI backend with streaming responses; supports both local LLM inference and cloud API fallback.
    - title: Multimodal Outcome Prediction from Linked Multi-Source Data
      description:
        - Built a multimodal XGBoost pipeline integrating structured clinical data with text-derived features from unstructured free-text, predicting outcomes across 175,000+ records with ROC-AUC of 0.86.
        - Constructed geospatial and temporal features -- including haversine distances from linked SA1 geodata and rolling history counts (30- and 90-day windows) -- executed on an Azure cloud virtual machine.

